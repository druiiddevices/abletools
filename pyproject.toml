[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abletools"
version = "0.1.0"
description = "Deterministic Ableton asset generation and validation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
abletools = "abletools.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
