name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build and validate smoke pack
        run: |
          abletools demo --output build/smoke --seed 1842
          abletools validate build/smoke
          abletools validate build/smoke.zip
      - name: Build and validate DRUIID MIDI Essentials
        run: |
          abletools druiid-midi --output build/druiid-midi --seed 1842 --root A --scale minor
          abletools validate build/druiid-midi
          abletools validate build/druiid-midi.zip
